<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>＝LOVEイントロクイズ</title>

  <!-- タブに表示されるアイコン（favicon） -->
  <link rel="icon" type="image/svg+xml" href="favicon.svg">

  <!-- Google Fonts: 丸みのある読みやすい日本語フォント「M PLUS Rounded 1c」を読み込む -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!-- 背景演出：うっすらギンガムチェック模様・ぼかしたレコード盤・ステージライトの光・キラキラの粒。
       ゲームの内容とは無関係な飾りなので、スクリーンリーダーには読み上げさせない。 -->
  <div class="bg-pattern" aria-hidden="true"></div>
  <div class="bg-vinyl v1" aria-hidden="true"></div>
  <div class="bg-vinyl v2" aria-hidden="true"></div>
  <div class="light-blob pink" aria-hidden="true"></div>
  <div class="light-blob blue" aria-hidden="true"></div>
  <div class="light-blob yellow" aria-hidden="true"></div>
  <div id="sparkle-field" class="sparkle-field" aria-hidden="true"></div>

  <!-- ゲームフレーム：PCで開いてもスマホゲームのように見える、中央のカード -->
  <main class="game-frame">

    <!-- スタート画面：出題数とカテゴリを選んでクイズを開始する画面 -->
    <!-- 今はまだ画面切り替えの仕組み（screens.js）がないので、is-active を付けて仮に表示している -->
    <section id="start-screen" class="screen is-active">
      <!-- カード上端に添える小さな星の飾り。CSS側でカード基準の絶対位置に配置する -->
      <span class="ribbon-charm" aria-hidden="true">
        <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0 9.4 6.6 16 8 9.4 9.4 8 16 6.6 9.4 0 8 6.6 6.6Z"/></svg>
      </span>

      <div class="title-block">
        <p class="eyebrow-chip">
          <svg class="mini-star" viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0 9.4 6.6 16 8 9.4 9.4 8 16 6.6 9.4 0 8 6.6 6.6Z"/></svg>
          MUSIC INTRO QUIZ
        </p>

        <!-- ロゴ：パステルカラーのレコード盤がゆっくり回転する演出 -->
        <div class="logo-badge">
          <div class="vinyl-spin">
            <span class="vinyl-center">
              <svg viewBox="0 0 16 16" fill="currentColor" aria-hidden="true"><path d="M8 0 9.4 6.6 16 8 9.4 9.4 8 16 6.6 9.4 0 8 6.6 6.6Z"/></svg>
            </span>
          </div>
        </div>

        <h1>
          <span class="title-spark tl" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0 9.4 6.6 16 8 9.4 9.4 8 16 6.6 9.4 0 8 6.6 6.6Z"/></svg>
          </span>
          <!-- 音符に小さな星を添えた、特別仕様の音符アイコン -->
          <span class="note-icon left" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 20V8.4a1 1 0 0 1 .79-.98l8-1.8A1 1 0 0 1 19 6.6V17a3 3 0 1 1-2-2.83V9.1l-6 1.35v9.55a3 3 0 1 1-2-2.83Z" fill="currentColor"/>
              <path d="M22 1.5 23 4.5 26 5.5 23 6.5 22 9.5 21 6.5 18 5.5 21 4.5Z" fill="var(--color-accent)"/>
            </svg>
          </span>
          <span><span class="eq">＝</span>LOVEイントロクイズ</span>
          <span class="note-icon right" aria-hidden="true">
            <svg viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M9 20V8.4a1 1 0 0 1 .79-.98l8-1.8A1 1 0 0 1 19 6.6V17a3 3 0 1 1-2-2.83V9.1l-6 1.35v9.55a3 3 0 1 1-2-2.83Z" fill="currentColor"/>
              <path d="M22 1.5 23 4.5 26 5.5 23 6.5 22 9.5 21 6.5 18 5.5 21 4.5Z" fill="var(--color-accent)"/>
            </svg>
          </span>
          <span class="title-spark tr" aria-hidden="true">
            <svg viewBox="0 0 16 16" fill="currentColor"><path d="M8 0 9.4 6.6 16 8 9.4 9.4 8 16 6.6 9.4 0 8 6.6 6.6Z"/></svg>
          </span>
        </h1>
      </div>

      <!-- イコライザー風の飾り区切り。曲が流れているような臨場感を添える -->
      <div class="eq-divider" aria-hidden="true">
        <span style="--peak: 10px; animation-delay: 0s;"></span>
        <span style="--peak: 18px; animation-delay: 0.1s;"></span>
        <span style="--peak: 13px; animation-delay: 0.2s;"></span>
        <span style="--peak: 22px; animation-delay: 0.05s;"></span>
        <span style="--peak: 12px; animation-delay: 0.25s;"></span>
        <span style="--peak: 19px; animation-delay: 0.15s;"></span>
        <span style="--peak: 9px; animation-delay: 0.3s;"></span>
      </div>

      <fieldset>
        <legend>出題数</legend>
        <label><input type="radio" name="question-count" value="5" checked> 5問</label>
        <label><input type="radio" name="question-count" value="10"> 10問</label>
        <label><input type="radio" name="question-count" value="all"> 全曲</label>
      </fieldset>

      <fieldset>
        <legend>カテゴリ</legend>
        <label><input type="radio" name="category-filter" value="all" checked> 全曲（ユニット曲も含む）</label>
        <label><input type="radio" name="category-filter" value="title-and-group"> 表題曲＋全員曲</label>
        <label><input type="radio" name="category-filter" value="title-track"> 表題曲のみ</label>
      </fieldset>

      <!-- 曲数が足りない場合などのエラーメッセージ。普段は空・非表示 -->
      <p id="start-error" class="error-message" hidden></p>

      <button id="start-button" class="primary-button" type="button">スタート</button>
    </section>

    <!-- クイズ画面：イントロ再生、4択、タイマー、正誤表示を行う画面 -->
    <section id="quiz-screen" class="screen">
      <p id="question-progress">第1問 / 5問</p>

      <!-- 出題の進み具合を、丸(ドット)で視覚的に示す場所。中身はJSで生成する -->
      <div id="progress-dots" class="progress-dots"></div>

      <!-- controls は付けず、シークして曲を先読みできないようにしている -->
      <audio id="intro-audio"></audio>
      <!-- 音源が再生できない場合のエラーメッセージ。普段は空・非表示 -->
      <p id="audio-error" class="error-message" hidden></p>

      <p id="timer-display">経過: 0秒</p>

      <div id="choice-buttons">
        <button class="choice-button" type="button">選択肢1</button>
        <button class="choice-button" type="button">選択肢2</button>
        <button class="choice-button" type="button">選択肢3</button>
        <button class="choice-button" type="button">選択肢4</button>
      </div>

      <!-- 分からないときに使う、スキップ・答えを見るボタン。回答すると隠れる -->
      <div id="quiz-actions">
        <button id="skip-button" class="secondary-button" type="button">スキップ</button>
        <button id="reveal-button" class="secondary-button" type="button">答えを見る</button>
      </div>

      <!-- 正解/不正解の結果。普段は空・非表示 -->
      <p id="feedback" class="feedback-message" hidden></p>

      <button id="next-button" class="primary-button" type="button" hidden>次へ</button>
    </section>

    <!-- 結果画面：合計得点と内訳を表示し、リトライできる画面 -->
    <section id="result-screen" class="screen">
      <h2>結果発表</h2>
      <p id="total-score-display">合計得点: 0点</p>
      <p id="rank-display">ランク: C</p>
      <p id="high-score-display">自己ベスト: 0点</p>
      <!-- 自己ベストを更新したときだけ表示するお知らせ。普段は空・非表示 -->
      <p id="new-record-badge" hidden>🎉 新記録！</p>

      <!-- 1問ごとの正誤・得点をJSで一覧表示する場所 -->
      <ul id="answer-log-list"></ul>

      <button id="retry-button" class="primary-button" type="button">もう一度挑戦する</button>
    </section>

  </main>

  <!-- ES Modulesを使うため type="module" が必須。ローカルサーバー経由でないと動かない -->
  <script type="module" src="js/main.js"></script>
</body>
</html>
