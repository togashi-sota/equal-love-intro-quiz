<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ユニットテスト結果</title>
  <style>
    body {
      font-family: sans-serif;
      max-width: 640px;
      margin: 40px auto;
      padding: 0 16px;
      color: #3a2233;
    }
    #test-summary {
      font-size: 1.2rem;
      font-weight: bold;
      padding: 12px;
      border-radius: 8px;
      background-color: #f4f4f4;
    }
  </style>
</head>
<body>
  <h1>ユニットテスト実行結果</h1>
  <p>各関数の計算結果が期待通りになっているかを自動でチェックしています。詳しい結果は開発者ツール（F12）のConsoleタブで確認できます。</p>
  <div id="test-summary">実行中...</div>

  <script type="module">
    import { runScoreTests } from "./tests/score.test.js";
    import { runQuizTests } from "./tests/quiz.test.js";
    import { runLyricsStorageTests } from "./tests/lyricsStorage.test.js";
    import { runLyricsSyncTests } from "./tests/lyricsSync.test.js";
    import { runCallSyncTests } from "./tests/callSync.test.js";
    import { runCallStorageTests } from "./tests/callStorage.test.js";
    import { runContentHashTests } from "./tests/contentHash.test.js";
    import { runCallGuidePanelTests } from "./tests/callGuidePanel.test.js";
    import { runCallGuideStorageTests } from "./tests/callGuideStorage.test.js";
    import { runMemberUtilsTests } from "./tests/memberUtils.test.js";
    import { runAudioMetadataTests } from "./tests/audioMetadata.test.js";
    import { runRandomPlaybackEngineTests } from "./tests/randomPlaybackEngine.test.js";
    import { runLyricsSegmentEngineTests } from "./tests/lyricsSegmentEngine.test.js";
    import { runLyricsQuizEngineTests } from "./tests/lyricsQuizEngine.test.js";
    import { runLyricsQuizQuestionBuilderTests } from "./tests/lyricsQuizQuestionBuilder.test.js";
    import { runLyricsQuizRunStateTests } from "./tests/lyricsQuizRunState.test.js";
    import { runLyricsQuizScoreTests } from "./tests/lyricsQuizScore.test.js";
    import { runBattleRulesSharedDefaultsTests } from "./tests/battleRules/sharedDefaults.test.js";
    import { runClassicRuleTests } from "./tests/battleRules/classicRule.test.js";
    import { runStealRuleTests } from "./tests/battleRules/stealRule.test.js";
    import { runComboRuleTests } from "./tests/battleRules/comboRule.test.js";
    import { runBattleRulesIndexTests } from "./tests/battleRules/index.test.js";
    import { runLyricsQuizBattleModeTests } from "./tests/battleModes/lyricsQuizBattleMode.test.js";
    import { runLyricsQuizMatchProgressTests } from "./tests/lyricsQuizMatchProgress.test.js";
    import { runLyricsQuizBattleFirebaseTests } from "./tests/lyricsQuizBattleFirebase.test.js";
    import { runLyricsQuizBattleSecurityRulesTests } from "./tests/lyricsQuizBattleSecurityRules.test.js";
    import { runLyricsQuizBattleUiTests } from "./tests/lyricsQuizBattleUi.test.js";
    import { runLyricsQuizBattleTimingTests } from "./tests/lyricsQuizBattleTiming.test.js";
    import { runOnlineBattleStartSettingsTests } from "./tests/onlineBattleStartSettings.test.js";
    import { runQuestionSourceTests } from "./tests/questionSource.test.js";
    import { runSpecialModesScreenTests } from "./tests/specialModesScreen.test.js";
    import { runAchievementEvaluationTests } from "./tests/achievementEvaluation.test.js";
    import { runAchievementProgressTests } from "./tests/achievementProgress.test.js";
    import { runAchievementListTests } from "./tests/achievementList.test.js";
    import { runSpecialModeIconsTests } from "./tests/specialModeIcons.test.js";
    import { runPublicProfilePayloadsTests } from "./tests/publicProfilePayloads.test.js";
    import {
      runFanProfileCardTests,
      runGetRepresentativeAchievementCandidatesTests,
      runBuildAchievementCountTextTests,
      runBuildRepresentativeAchievementChipTests,
      runBuildFriendAchievementSummaryTests,
    } from "./tests/fanProfileCard.test.js";
    import { runMembersScreenTests } from "./tests/membersScreen.test.js";
    import { runTimeAttackScoreTests } from "./tests/timeAttackScore.test.js";
    import { runTimeAttackHistoryTests } from "./tests/timeAttackHistory.test.js";
    import { runTimeAttackScreenTests } from "./tests/timeAttackScreen.test.js";
    import { runTimeAttackLeaderboardTests } from "./tests/timeAttackLeaderboard.test.js";
    import { runPlayHistoryTests } from "./tests/playHistory.test.js";
    import { runResponseTimeTests } from "./tests/responseTime.test.js";
    import { runSpeedAchievementProgressTests } from "./tests/speedAchievementProgress.test.js";
    import { runSoundManagerTests } from "./tests/soundManager.test.js";
    import { runKaraokeSyncTests } from "./tests/karaokeSync.test.js";
    import { runStoragePersistenceTests } from "./tests/storagePersistence.test.js";
    import { runOnboardingScreenTests } from "./tests/onboardingScreen.test.js";
    import { runGuideContentTests } from "./tests/guideContent.test.js";
    import { runSonglistTests } from "./tests/songlist.test.js";
    import { runRankingCandidateStoreTests } from "./tests/rankingCandidateStore.test.js";
    import { runCenterCelebrationTests } from "./tests/centerCelebration.test.js";
    import { runYoutubeThumbnailTests } from "./tests/youtubeThumbnail.test.js";
    import { runWeakSongStatsTests } from "./tests/weakSongStats.test.js";
    import { runShuffleAndOutroWeakSongStatsTests } from "./tests/shuffleAndOutroWeakSongStats.test.js";
    import { runLyricsQuizWeakSongStatsTests } from "./tests/lyricsQuizWeakSongStats.test.js";
    import { runNormalQuizTimeScoreTests } from "./tests/normalQuizTimeScore.test.js";
    import { runLyricsQuizIntegritySweepTests } from "./tests/lyricsQuizIntegritySweep.test.js";
    import { runCustomQuizPresetsTests } from "./tests/customQuizPresets.test.js";
    import { runPlayerProfileTests } from "./tests/playerProfile.test.js";
    import { runBackupSyncTests } from "./tests/backupSync.test.js";
    import { runDataPackImportTests } from "./tests/dataPackImport.test.js";
    import { runZipPackImportTests } from "./tests/zipPackImport.test.js";
    import { runScrollLockTests } from "./tests/scrollLock.test.js";
    import { runOnlineBattleCollaborativeSelectionTests } from "./tests/onlineBattleCollaborativeSelection.test.js";
    import { runOnlineBattleSongAvailabilityTests } from "./tests/onlineBattleSongAvailability.test.js";
    import { runTimeAttackBattleModeTests } from "./tests/battleModes/timeAttackBattleMode.test.js";
    import { runOutroBattleModeTests } from "./tests/battleModes/outroBattleMode.test.js";
    import { runInstantBattleModeTests } from "./tests/battleModes/instantBattleMode.test.js";
    import { runInstantCoopMatchProgressTests } from "./tests/instantCoopMatchProgress.test.js";
    import { runInstantBattleMatchProgressTests } from "./tests/instantBattleMatchProgress.test.js";
    import { runOnlineBattleHostTransitionPayloadsTests } from "./tests/onlineBattleHostTransitionPayloads.test.js";
    import { runOnlineBattleMatchProgressTests } from "./tests/onlineBattleMatchProgress.test.js";
    import { runBattleModesIndexAvailabilityTests } from "./tests/battleModes/index.test.js";
    import { runNewSingleAnnouncementTests } from "./tests/newSingleAnnouncement.test.js";
    import { runBattleQuestionBreakdownTests } from "./tests/battleQuestionBreakdown.test.js";
    import { runOnlineBattleMatchConfirmationPayloadsTests } from "./tests/onlineBattleMatchConfirmationPayloads.test.js";
    import { printSummary } from "./tests/test-utils.js";

    runScoreTests();
    runQuizTests();
    // runLyricsStorageTestsは内部でFile APIを使う非同期テストを含むため、
    // 集計（printSummary）より前に必ず完了を待つ（module scriptはトップレベルawaitに対応している）。
    await runLyricsStorageTests();
    runLyricsSyncTests();
    runCallSyncTests();
    await runCallStorageTests();
    await runContentHashTests();
    runCallGuidePanelTests();
    await runCallGuideStorageTests();
    runMemberUtilsTests();
    runAudioMetadataTests();
    runRandomPlaybackEngineTests();
    runLyricsSegmentEngineTests();
    runLyricsQuizEngineTests();
    runLyricsQuizQuestionBuilderTests();
    runLyricsQuizRunStateTests();
    runLyricsQuizScoreTests();
    runBattleRulesSharedDefaultsTests();
    runClassicRuleTests();
    runStealRuleTests();
    runComboRuleTests();
    runBattleRulesIndexTests();
    await runLyricsQuizBattleModeTests();
    runLyricsQuizMatchProgressTests();
    runLyricsQuizBattleFirebaseTests();
    runLyricsQuizBattleSecurityRulesTests();
    runLyricsQuizBattleUiTests();
    runLyricsQuizBattleTimingTests();
    runOnlineBattleStartSettingsTests();
    runQuestionSourceTests();
    runSpecialModesScreenTests();
    runAchievementEvaluationTests();
    runAchievementProgressTests();
    runAchievementListTests();
    runSpecialModeIconsTests();
    runPublicProfilePayloadsTests();
    runFanProfileCardTests();
    runGetRepresentativeAchievementCandidatesTests();
    runBuildAchievementCountTextTests();
    runBuildRepresentativeAchievementChipTests();
    runBuildFriendAchievementSummaryTests();
    runMembersScreenTests();
    runTimeAttackScoreTests();
    runTimeAttackHistoryTests();
    runTimeAttackScreenTests();
    runTimeAttackLeaderboardTests();
    runPlayHistoryTests();
    runResponseTimeTests();
    runSpeedAchievementProgressTests();
    runSoundManagerTests();
    runKaraokeSyncTests();
    await runStoragePersistenceTests();
    runOnboardingScreenTests();
    runGuideContentTests();
    runSonglistTests();
    runRankingCandidateStoreTests();
    runCenterCelebrationTests();
    runYoutubeThumbnailTests();
    runWeakSongStatsTests();
    runShuffleAndOutroWeakSongStatsTests();
    runLyricsQuizWeakSongStatsTests();
    runNormalQuizTimeScoreTests();
    runLyricsQuizIntegritySweepTests();
    runCustomQuizPresetsTests();
    runPlayerProfileTests();
    runBackupSyncTests();
    await runDataPackImportTests();
    await runZipPackImportTests();
    runScrollLockTests();
    runOnlineBattleSongAvailabilityTests();
    runOnlineBattleCollaborativeSelectionTests();
    runTimeAttackBattleModeTests();
    runOutroBattleModeTests();
    runInstantBattleModeTests();
    runInstantCoopMatchProgressTests();
    runInstantBattleMatchProgressTests();
    runOnlineBattleHostTransitionPayloadsTests();
    runOnlineBattleMatchProgressTests();
    runBattleModesIndexAvailabilityTests();
    runNewSingleAnnouncementTests();
    runBattleQuestionBreakdownTests();
    runOnlineBattleMatchConfirmationPayloadsTests();
    const { passCount, failCount } = printSummary();

    const summaryElement = document.getElementById("test-summary");
    if (failCount === 0) {
      summaryElement.textContent = `✅ 全${passCount}件のテストに成功しました`;
      summaryElement.style.color = "#1b7a3d";
    } else {
      summaryElement.textContent = `❌ ${failCount}件のテストに失敗しました（${passCount}件成功）。詳細はConsoleを確認してください。`;
      summaryElement.style.color = "#c0392b";
    }
  </script>
</body>
</html>
