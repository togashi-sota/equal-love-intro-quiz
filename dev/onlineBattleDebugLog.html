<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>【開発用】オンライン対戦 デバッグログ</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@400;700;800&display=swap" rel="stylesheet">

  <!-- 色・フォント等の共通トークン（CSS変数）を再利用するため、本編と同じスタイルシートを読み込む。
       このページ専用のレイアウトは下の<style>に自己完結させ、本編用のcss/style.cssには追記しない。 -->
  <link rel="stylesheet" href="../css/style.css">

  <style>
    body {
      display: block;
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 16px 60px;
      font-family: "M PLUS Rounded 1c", sans-serif;
      color: var(--color-text);
    }

    h1 {
      font-size: 1.3rem;
      margin: 0 0 8px;
    }

    .page-description {
      font-size: 0.85rem;
      opacity: 0.75;
      line-height: 1.6;
      margin: 0 0 20px;
    }

    .button-row {
      display: flex;
      gap: 10px;
      margin-bottom: 16px;
    }

    .button-row button {
      flex: 1;
    }

    .empty-notice {
      font-size: 0.85rem;
      opacity: 0.7;
      text-align: center;
      padding: 32px 16px;
      border: 1px dashed var(--color-card-border);
      border-radius: 12px;
    }

    .log-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .log-entry {
      border: 1px solid var(--color-card-border);
      border-radius: 12px;
      padding: 12px 14px;
      background: var(--color-surface-glass);
      font-size: 0.8rem;
      line-height: 1.7;
    }

    .log-entry-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .log-entry-outcome-success {
      color: var(--color-primary-dark);
    }

    .log-entry-outcome-failure {
      color: var(--color-danger);
    }

    .log-entry-row {
      display: flex;
      gap: 6px;
    }

    .log-entry-row .k {
      opacity: 0.6;
      flex: none;
      width: 8.5em;
    }

    .log-entry-row .v {
      word-break: break-all;
    }

    .copy-textarea {
      width: 100%;
      box-sizing: border-box;
      margin-top: 16px;
      height: 120px;
      font-size: 0.7rem;
      font-family: monospace;
    }
  </style>
</head>
<body>
  <h1>オンライン対戦 デバッグログ</h1>
  <p class="page-description">
    Firebase Realtime Databaseの<code>runTransaction()</code>が、実際にはルームが存在するのに
    稀に<code>null</code>を受け取ってしまう不具合（自動で再試行するようになっている）が、
    この端末でどのくらいの頻度・条件で起きているかを確認するためのページです。
    1回目の試行で成功した通常時は記録されず、実際に再試行が発生した場合だけ記録されます。
    本編のコードとは独立しており、このページの操作は本編に一切影響しません。
  </p>

  <div class="button-row">
    <button id="reload-button" class="secondary-button" type="button">更新</button>
    <button id="clear-button" class="secondary-button" type="button">ログをクリア</button>
  </div>

  <div id="content"></div>

  <textarea id="copy-textarea" class="copy-textarea" readonly hidden></textarea>

  <script type="module">
    // js/onlineBattle.jsが書き込むキーと同じ名前（キー名を変える場合は両方直すこと）。
    const DEBUG_LOG_KEY = "equalLoveIntroQuiz.onlineBattle.debugLog";

    function getDebugLog() {
      try {
        const raw = localStorage.getItem(DEBUG_LOG_KEY);
        return raw ? JSON.parse(raw) : [];
      } catch (error) {
        return [];
      }
    }

    function formatOutcome(entry) {
      if (entry.outcome === "success") {
        return { text: `成功（${entry.succeededOnAttempt}回目の試行）`, className: "log-entry-outcome-success" };
      }
      return { text: `失敗（${entry.attemptsUsed}回すべて失敗）`, className: "log-entry-outcome-failure" };
    }

    function formatRole(role) {
      return { host: "ホスト", participant: "参加者", unknown: "不明" }[role] ?? role;
    }

    function render() {
      const log = getDebugLog();
      const content = document.getElementById("content");
      const textarea = document.getElementById("copy-textarea");

      if (log.length === 0) {
        content.innerHTML = '<p class="empty-notice">この端末では、まだこの不具合は記録されていません。</p>';
        textarea.hidden = true;
        return;
      }

      // 新しいものが上に来るように並べ替える。
      const sorted = [...log].reverse();
      content.innerHTML = '<div class="log-list"></div>';
      const list = content.querySelector(".log-list");

      sorted.forEach((entry) => {
        const outcome = formatOutcome(entry);
        const row = document.createElement("div");
        row.className = "log-entry";
        row.innerHTML = `
          <div class="log-entry-header">
            <span>ルーム ${entry.roomId ?? "-"}</span>
            <span class="${outcome.className}">${outcome.text}</span>
          </div>
          <div class="log-entry-row"><span class="k">発生時刻</span><span class="v">${entry.loggedAt ?? "-"}</span></div>
          <div class="log-entry-row"><span class="k">役割</span><span class="v">${formatRole(entry.role)}</span></div>
          <div class="log-entry-row"><span class="k">使った試行回数</span><span class="v">${entry.attemptsUsed ?? "-"} / ${entry.maxAttempts ?? "-"}</span></div>
          <div class="log-entry-row"><span class="k">オンライン状態</span><span class="v">${entry.online === false ? "オフライン" : "オンライン"}</span></div>
          <div class="log-entry-row"><span class="k">端末・ブラウザ</span><span class="v">${entry.userAgent ?? "-"}</span></div>
        `;
        list.appendChild(row);
      });

      textarea.hidden = false;
      textarea.value = JSON.stringify(log, null, 2);
    }

    document.getElementById("reload-button").addEventListener("click", render);
    document.getElementById("clear-button").addEventListener("click", () => {
      localStorage.removeItem(DEBUG_LOG_KEY);
      render();
    });

    render();
  </script>
</body>
</html>
