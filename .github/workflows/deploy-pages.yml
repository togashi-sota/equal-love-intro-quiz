# GitHub Pages の公開と、YouTube 出演図鑑の自動更新（2026-11-03。本人の許可のあとで有効化）
#
# 最初の設定（YouTube のキーの Secrets・合図用のトークン・Apps Script）は scripts/youtube/SETUP.md。
# master への push の公開も、このファイルが受け持つ（dev/・tests/・tests.html・scripts/ は公開しない）。
#
# 何をするか：
# - 公開のたびに（master への push・手動の実行・外からの合図〈workflow_dispatch〉・予備の定期実行）、
#   YouTube Data API v3 で公式チャンネルの動画を取り直し、data/youtube-appearances.json を作って、Pages の成果物にだけ入れる
# - git にはコミットも push もしない（permissions は contents: read。リポジトリのファイルは変えられない）
# - 取得・検査に失敗したら：定期の更新では公開しない（サイトは前のまま）。push のときは前のデータ（30日以内）でアプリだけ公開する
# - 前のデータが30日を過ぎていたら、データを外して公開する（アプリは「更新が止まっています」と出す）
# - 知らせる必要があるとき（失敗・説明欄の変化）は Issue を作る（同じ題の Issue が開いていれば、コメントを足す）
# 【2026-11-03追加・R11 D】＝LOVE 最新情報（公式サイトの NEWS のタイトル・日付）も、YouTube とは別の手順で作る（scripts/news/）。
# - data/official-news.json を作り、Pages の成果物にだけ入れる（git にはコミットしない。.gitignore 済み）
# - ニュースの取得が失敗しても YouTube の更新・公開は止めない（continue-on-error・スクリプトは外の障害で失敗にしない）
# - YouTube の取得が失敗して「公開しない」と決めても、ニュースが新しく取れたら、YouTube は前のデータ（30日以内）のままで公開する
# - 知らせる Issue の題は YouTube と分ける（「＝LOVE 最新情報の自動取得：確認が必要です」）
name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      reason:
        description: "実行の理由（外からの合図は scheduled-dispatch）"
        required: false
        default: "manual"
  # 毎日の定期実行（毎日 03:23 JST。2026-11-09 本人の依頼で毎週木曜→毎日。GitHub が混むと数時間遅れることがある）。
  # 60日止まらない土台の合図は、外（Google Apps Script）から毎週月曜に来る。
  # 公開リポジトリでは、60日間リポジトリに動きが無いとこの定期実行だけが止まる（外からの合図は止まらない）
  schedule:
    - cron: "23 18 * * *"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  pages: write
  id-token: write
  issues: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.publish.outputs.deploy }}
    steps:
      - name: リポジトリを取得
        uses: actions/checkout@v4

      - name: Node を用意
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: YouTube のデータを作る
        id: youtube
        env:
          # キーは Secrets から環境変数で渡すだけ（コマンドの引数にしない・表示しない）
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${{ github.event_name }}" in
            push) TRIGGER=push ;;
            schedule) TRIGGER=schedule ;;
            *) TRIGGER=dispatch ;;
          esac
          node scripts/youtube/refresh.mjs \
            --trigger "$TRIGGER" \
            --previous-url "https://togashi-sota.github.io/equal-love-intro-quiz/data/youtube-appearances.json" \
            --report "$RUNNER_TEMP/youtube-issue.md"

      # 【2026-11-03追加・R11 D】ここから＝LOVE 最新情報（YouTube の手順とは独立。失敗してもほかの手順は続ける）
      - name: ＝LOVE 最新情報のデータを作る
        id: news
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${{ github.event_name }}" in
            push) TRIGGER=push ;;
            schedule) TRIGGER=schedule ;;
            *) TRIGGER=dispatch ;;
          esac
          node scripts/news/refresh-news.mjs             --trigger "$TRIGGER"             --previous-url "https://togashi-sota.github.io/equal-love-intro-quiz/data/official-news.json"             --report "$RUNNER_TEMP/news-issue.md"

      # 【2026-11-24追加】＝LOVEカレンダー（公式 SCHEDULE。YouTube・最新情報とは独立。失敗してもほかの手順は続ける）
      # 前のデータ＝git の土台（data/calendar/official-schedule-seed.json）＋公開中のデータ。消さずに足す。git にはコミットしない
      # 公開するかどうかの判断（YouTube・最新情報）は変えない。カレンダーは、そのときの公開に一緒に載るだけ
      - name: ＝LOVEカレンダーのデータを作る
        id: calendar
        continue-on-error: true
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          case "${{ github.event_name }}" in
            push) TRIGGER=push ;;
            schedule) TRIGGER=schedule ;;
            *) TRIGGER=dispatch ;;
          esac
          node scripts/calendar/refresh-calendar.mjs --trigger "$TRIGGER" --previous-url "https://togashi-sota.github.io/equal-love-intro-quiz/data/official-schedule.json" --archive-url "https://raw.githubusercontent.com/togashi-sota/equal-love-intro-quiz/calendar-data/calendar/official-schedule-archive.json" --report "$RUNNER_TEMP/calendar-issue.md"

      # 【2026-11-25追加】カレンダーのデータが作れなかった日（手順が途中で落ちた等）も、取得済みの予定を公開から消さない：
      # 公開中のデータ → 長く残す記録（calendar-data の枝）→ git の土台 の順で、前のものをそのまま入れる（公式サイトには行かない）
      - name: ＝LOVEカレンダーのデータが無いときは、前のデータを入れ直す
        id: calendar_keep
        if: always()
        continue-on-error: true
        run: |
          OUT=data/official-schedule.json
          if [ ! -s "$OUT" ]; then
            curl -fsS --max-time 30 "https://togashi-sota.github.io/equal-love-intro-quiz/data/official-schedule.json" -o "$OUT"               || curl -fsS --max-time 30 "https://raw.githubusercontent.com/togashi-sota/equal-love-intro-quiz/calendar-data/calendar/official-schedule-archive.json" -o "$OUT"               || node scripts/calendar/refresh-calendar.mjs --seed-only
          fi
          # 形を確かめる（壊れていれば消して、アプリは git の土台を読む）
          if node -e 'import("./js/calendarCore.js").then(c=>{const d=c.fromStoredCalendarData(JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")));process.exit(c.validateCalendarData(d).ok?0:1)})' "$OUT"; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            rm -f "$OUT"; echo "ready=false" >> "$GITHUB_OUTPUT"
          fi

      # 長く残す記録のワークフロー（.github/workflows/calendar-archive.yml）へ、今回のデータを渡す。
      # このワークフローは読むだけのまま（git には書かない）。書くのは別のワークフローが、カレンダーの記録の枝にだけ
      - name: ＝LOVEカレンダーのデータを記録の仕事へ渡す
        if: always() && steps.calendar_keep.outputs.ready == 'true'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: calendar-data
          path: data/official-schedule.json
          retention-days: 3

      - name: ＝LOVE 最新情報だけ新しいときは、YouTube のデータを前のまま入れ直す
        # YouTube の取得に失敗して「公開しない（keep-live）」と決めたときだけ。前のデータが30日以内なら入れる（API は呼ばない）
        id: youtube_keep
        if: steps.youtube.outputs.action == 'keep-live' && steps.news.outputs.fresh == 'true'
        continue-on-error: true
        run: |
          node scripts/youtube/keep-previous.mjs             --previous-url "https://togashi-sota.github.io/equal-love-intro-quiz/data/youtube-appearances.json"

      - name: 公開するかを決める
        # YouTube が公開すると決めた／YouTube は前のデータを入れ直せて、ニュースが新しい → 公開する
        id: publish
        run: |
          if [ "${{ steps.youtube.outputs.deploy }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          elif [ "${{ steps.youtube_keep.outputs.ok }}" = "true" ] && [ "${{ steps.news.outputs.fresh }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          else
            echo "deploy=false" >> "$GITHUB_OUTPUT"
          fi
      # 【2026-11-03追加・R11 D】ここまで

      - name: 自動の更新が YouTube のデータ以外を変えていないか確かめる
        # git で管理しているファイルは1つも変わっていないこと（data/youtube-appearances.json は .gitignore 済み）。
        # 無視されているファイルのうち新しくできてよいのは data/youtube-appearances.json と data/official-news.json（2026-11-03 R11 D）だけ
        run: |
          git diff --exit-code
          test -z "$(git status --porcelain)"
          EXTRA=$(git status --porcelain --ignored | grep -v '^!! data/$' | grep -v '^!! data/youtube-appearances.json$' | grep -v '^!! data/official-news.json$' | grep -v '^!! data/official-schedule.json$' || true)
          if [ -n "$EXTRA" ]; then echo "想定外のファイル：$EXTRA"; exit 1; fi

      - name: 知らせる（Issue）
        if: steps.youtube.outputs.alert == 'true' || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="YouTube 出演図鑑の自動更新：確認が必要です"
          BODY_FILE="$RUNNER_TEMP/youtube-issue.md"
          [ -f "$BODY_FILE" ] || echo "自動更新の途中で失敗しました。実行の記録：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$BODY_FILE"
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$NUMBER" ]; then gh issue comment "$NUMBER" --body-file "$BODY_FILE"; else gh issue create --title "$TITLE" --body-file "$BODY_FILE"; fi

      # 【2026-11-03追加・R11 D】＝LOVE 最新情報の知らせ（YouTube とは別の題。この手順が失敗しても公開は止めない）
      - name: 知らせる（Issue・＝LOVE 最新情報）
        if: always() && (steps.news.outputs.alert == 'true' || steps.news.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="＝LOVE 最新情報の自動取得：確認が必要です"
          BODY_FILE="$RUNNER_TEMP/news-issue.md"
          [ -f "$BODY_FILE" ] || echo "＝LOVE 最新情報の自動取得の途中で失敗しました。実行の記録：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$BODY_FILE"
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$NUMBER" ]; then gh issue comment "$NUMBER" --body-file "$BODY_FILE"; else gh issue create --title "$TITLE" --body-file "$BODY_FILE"; fi

      # 【2026-11-24追加】＝LOVEカレンダーの知らせ（題を分ける。この手順が失敗しても公開は止めない）
      - name: 知らせる（Issue・＝LOVEカレンダー）
        if: always() && (steps.calendar.outputs.alert == 'true' || steps.calendar.outcome == 'failure')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TITLE="＝LOVEカレンダーの自動取得：確認が必要です"
          BODY_FILE="$RUNNER_TEMP/calendar-issue.md"
          [ -f "$BODY_FILE" ] || echo "＝LOVEカレンダーの自動取得の途中で失敗しました。実行の記録：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}" > "$BODY_FILE"
          KEY=$(grep -o 'calendar-key:[0-9a-f]*' "$BODY_FILE" | head -1 || true)
          NUMBER=$(gh issue list --state open --search "$TITLE in:title" --json number --jq '.[0].number')
          if [ -n "$NUMBER" ]; then
            # 前の知らせと同じ中身（同じ印）なら、コメントを重ねない
            LAST=$(gh issue view "$NUMBER" --json body,comments --jq '([.body] + [.comments[].body]) | last')
            if [ -n "$KEY" ] && printf '%s' "$LAST" | grep -q "$KEY"; then echo "前と同じ知らせなので書かない"; exit 0; fi
            gh issue comment "$NUMBER" --body-file "$BODY_FILE"
          else
            gh issue create --title "$TITLE" --body-file "$BODY_FILE"
          fi

      - name: 公開しないフォルダ・ファイルを除外する
        if: steps.publish.outputs.deploy == 'true'
        run: |
          rm -rf dev
          rm -rf tests
          rm -f tests.html
          rm -rf scripts

      - name: Pages用の設定
        if: steps.publish.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: 公開用データをアップロード
        if: steps.publish.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v4
        with:
          path: .

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: GitHub Pagesへデプロイ
        id: deployment
        uses: actions/deploy-pages@v4
